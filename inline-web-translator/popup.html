<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline Web Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="logo">译</div>
      <div class="title">
        <h1>Inline Web Translator</h1>
        <p class="subtitle">外语句子逐句翻译为中文</p>
      </div>
    </div>

    <div class="row">
      <label class="row-label" for="enabled">启用翻译</label>
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>

    <div class="row column">
      <label class="row-label" for="provider">翻译引擎</label>
      <select id="provider">
        <option value="google">Google 翻译</option>
        <option value="deepseek">DeepSeek AI</option>
        <option value="ark">火山方舟</option>
      </select>
    </div>

    <div class="row">
      <label class="row-label" for="blockGoogleWidget">屏蔽网页 Google 翻译</label>
      <label class="switch">
        <input type="checkbox" id="blockGoogleWidget">
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label class="row-label" for="hoverReveal">悬停显示译文</label>
      <label class="switch">
        <input type="checkbox" id="hoverReveal">
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label class="row-label" for="skipChinesePages">中文页面仅翻视频字幕</label>
      <label class="switch">
        <input type="checkbox" id="skipChinesePages">
        <span class="slider"></span>
      </label>
    </div>

    <p class="hint">外语句子下方会自动显示中文译文，逐句对照。</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
